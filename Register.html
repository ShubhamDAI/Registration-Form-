<html>
<head>
<title> Student Registeration Form </title>
</head>
<body bgcolor="mistyrose">
<h1 align="center"> Student Registeration Form </h1>

<form>
<table align="center" cellpadding="8">
<tr>
<td><label> Roll no : </label></td>
<td><input type="text" size="50"></td>
</tr>

<tr>
<td><label> Student name : </label> </td>
<td><input type="text" placeholder="First Name">-<input type="text" placeholder="Last Name"></td>
</tr>

<tr>
<td><label > Father's name : </label></td>
<td><input type="text" size="50"></td>
</tr>

<tr>
<td><label> Date Of birth: </label></td>
<td><input type="text" size="3" placeholder="Day">-<input type="text" size="3" placeholder="Month">-<input type="text" size="8" placeholder="Year">
<B><I>(DD-MM-YYYY)</I></B></td>
</tr>

<tr>
<td><label> Mobile no : </label></td>
<td><input type="text" size="1" value="+91">-<input type="text" size="42"></td>
</tr>

<tr>
<td><label> Email id : </label></td>
<td><input type="text" size="50"></td>
</tr>

<tr>
<td><label> password : </label></td>
<td><input type="password" size="50"></td>
</tr>

<tr>
<td><label> Gender :</label></td>
<td><input type="radio" name="g"> male
<input type="radio" name="g"> female</td>

<tr>
<td><label> Department : </label></td>
<td><input type="checkbox" name="d"> CSE 
<input type="checkbox" name="d"> IT
<input type="checkbox" name="d"> ECE
<input type="checkbox" name="d"> Civil
<input type="checkbox" name="d"> Mech</td>

<tr>
<td><label>Course :</label></td>
<td><select>
<option> -----------Select Current Course's-----------  </option>
<option> MDCE </option>
<option> ADCE </option>
<option> TALLY PRIME  </option>
<option> DATA SCIENCE</option>
</select></td>
</tr>

<tr>
<td><label> Student Photo : </label></td>
<td><input type="file"></td>
</tr>

<tr>
<td><label> City : </label></td>
<td><input type="text" size="50"></td>
</tr>

<tr>
<td><label> Address: </label></td>
<td><textarea cols="48" rows="5"> </textarea></td>
</tr>




<tr>
<td align="center"colspan=2><input type="submit" value="Register"></td>
</tr>

</form>
</table>

</body>
</html>
